  skin_type=combination: [combination skin, combo skin]
  skin_type=acne_prone: [acne prone, acne-prone, acne]
  hair_type=curly: [curly hair, curls, curly]
  hair_type=fine: [fine hair, thin hair]
  hair_type=thick: [thick hair]
  hair_type=color_treated: [color treated, color-treated, colored hair, dyed hair, bleached]
  hair_type=oily: [oily hair, greasy hair, oily scalp]
  hair_type=damaged: [damaged hair, dry hair, brittle hair]
  climate=humid: [humid, humidity]
  climate=dry: [dry climate, arid]
  climate=cold: [winter, cold weather]
