[project]
name = "evireview"
version = "0.3.1"
requires-python = ">=3.11"
dependencies = [
  "anthropic", "pydantic", "pyarrow", "duckdb", "pandas", "numpy", "rank_bm25",
  "sentence-transformers", "networkx", "streamlit", "pyvis", "pyyaml", "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
evireview = "evireview.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
evireview = ["*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
