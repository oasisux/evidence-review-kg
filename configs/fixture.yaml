project: evireview-kg
profile: fixture
seed: 42
runtime:
  platform: macos-arm64
  embedding_device: cpu
dataset:
  repo: fixture
  revision: fixture-v1
  category: Fixture_Beauty
  review_file: fixtures/reviews.jsonl
  meta_file: fixtures/meta.jsonl
  max_products: 100
  min_reviews_per_product: 1
  reviews_per_product: 20
  dev_products: 2
extraction:
  provider: mock
  model: rules-v1
  effort: low
  reviews_per_call: 8
verification:
  model: rules-v1
  effort: low
  candidates_per_call: 15
augmentation:
  threshold: 0.80
  dev_precision_target: 0.85
  max_gaps_per_product: 5
  gap_min_mentions: 2
  gap_max_claims: 1
  mention_cos: 0.45
  gaps_per_call: 3
seller:
  products_per_call: 5
  attr_merge_cos: 0.75    # EDC canonicalization: merge attribute names whose name+definition embeddings are this close
  value_merge_cos: 0.88   # merge values within one canonical attribute
answer:
  model: rules-v1
  effort: low
  max_evidence: 8
judge:
  model: rules-v1
  effort: low
retrieval:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  candidate_k: 50
  rrf_k: 60
  index_metadata: true        # every system also indexes each product's seller listing (fair to text baselines)
  seller_target_weight: 1.0   # context query, no reviewer of that context: weight when the seller targets it
  no_context_weight: 0.5      # ... and when the seller does not
relations:
  attr_aspect_model: rules-v1
  min_neighbors: 1
  min_neighbor_mentions: 1
  weight_grid: [0, 1]
  lambda_grid: [2, 4]
  interval: 0.8
coldstart:
  role_share: 0.5
  ks: [0, 1]
  min_hidden_mentions: 1
  title_neighbors: 3
  llm_review_neighbors: 2
budget:
  max_cost_usd: 0.0
  concurrency: 1
paths:
  processed: data/fixture/processed
  graphs: data/fixture/graphs
  cache: .cache/fixture
  runs: runs/fixture
  annotations: data/fixture/annotations
  reports: data/fixture/reports
