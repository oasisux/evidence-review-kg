project: evireview-kg
profile: research_rules
seed: 42
runtime:
  platform: macos-arm64
  embedding_device: cpu   # cpu | mps (falls back to cpu)
dataset:
  repo: McAuley-Lab/Amazon-Reviews-2023
  revision: 2b6d039ed471f2ba5fd2acb718bf33b0a7e5598e
  category: All_Beauty
  review_file: data/raw/All_Beauty.jsonl
  meta_file: data/raw/meta_All_Beauty.jsonl
  max_products: 100
  min_reviews_per_product: 15
  reviews_per_product: 20
  dev_products: 30         # split per family in proportion to its quota
  family_quotas:          # product families (aspects_v2.yaml) and products per family, seeded order within each
    skin_moisturizer: 50
    hair_care: 50
extraction:
  provider: mock
  model: claude-sonnet-5
  effort: low
  reviews_per_call: 8
verification:
  model: claude-sonnet-5
  effort: low
  candidates_per_call: 15
augmentation:
  threshold: 0.80
  dev_precision_target: 0.85
  max_gaps_per_product: 5
  gap_min_mentions: 2
  gap_max_claims: 1
  mention_cos: 0.45
  gaps_per_call: 3
seller:
  products_per_call: 5
  attr_merge_cos: 0.75    # EDC canonicalization: merge attribute names whose name+definition embeddings are this close
  value_merge_cos: 0.88   # merge values within one canonical attribute
answer:
  model: claude-sonnet-5
  effort: low
  max_evidence: 8
judge:
  model: claude-opus-5
  effort: medium
retrieval:
  encoder: sentence-transformers/all-MiniLM-L6-v2
  candidate_k: 50
  rrf_k: 60
  index_metadata: true        # every system also indexes each product's seller listing (fair to text baselines)
  seller_target_weight: 1.0   # context query, no reviewer of that context: weight when the seller targets it
  no_context_weight: 0.5      # ... and when the seller does not
budget:
  max_cost_usd: 60.0
  concurrency: 8
paths:
  processed: data/rules/processed
  graphs: data/rules/graphs
  cache: .cache/rules
  runs: runs/rules
  annotations: data/rules/annotations
  reports: data/rules/reports
